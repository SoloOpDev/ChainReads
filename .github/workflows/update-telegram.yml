name: Update Telegram Data

on:
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours
  workflow_dispatch:  # Manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon python-dotenv cryptg requests
          
      - name: Verify environment variables
        run: |
          echo "Checking required environment variables..."
          if [ -z "${{ secrets.TELEGRAM_API_ID }}" ]; then
            echo "❌ TELEGRAM_API_ID is missing"
            exit 1
          fi
          if [ -z "${{ secrets.TELEGRAM_API_HASH }}" ]; then
            echo "❌ TELEGRAM_API_HASH is missing"
            exit 1
          fi
          if [ -z "${{ secrets.TELEGRAM_SESSION }}" ]; then
            echo "❌ TELEGRAM_SESSION is missing"
            exit 1
          fi
          if [ -z "${{ secrets.TELEGRAM_UPDATE_SECRET }}" ]; then
            echo "❌ TELEGRAM_UPDATE_SECRET is missing"
            exit 1
          fi
          echo "✅ All required environment variables are present"
          
      - name: Fetch Telegram data
        run: python fetch_telegram_enhanced.py
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION: ${{ secrets.TELEGRAM_SESSION }}
          TELEGRAM_TRADING_CHANNELS: ${{ secrets.TELEGRAM_TRADING_CHANNELS }}
          TELEGRAM_AIRDROP_CHANNELS: ${{ secrets.TELEGRAM_AIRDROP_CHANNELS }}
          IMAGEKIT_PRIVATE_KEY: ${{ secrets.IMAGEKIT_PRIVATE_KEY }}
          IMAGEKIT_URL_ENDPOINT: ${{ secrets.IMAGEKIT_URL_ENDPOINT }}
          
      - name: Verify data file exists
        run: |
          if [ ! -f "telegram_posts.json" ]; then
            echo "❌ telegram_posts.json was not created by the fetch script"
            echo "Files in current directory:"
            ls -la
            exit 1
          fi
          
          # Check if file has valid JSON
          if ! python -m json.tool telegram_posts.json > /dev/null 2>&1; then
            echo "❌ telegram_posts.json contains invalid JSON"
            exit 1
          fi
          
          # Check if file has posts
          POST_COUNT=$(python -c "import json; data=json.load(open('telegram_posts.json')); print(len(data.get('results', [])))")
          echo "📊 Found $POST_COUNT posts in telegram_posts.json"
          
          if [ "$POST_COUNT" -eq 0 ]; then
            echo "⚠️ No posts found, skipping API upload"
            exit 0
          fi
          
      - name: Send data to API
        env:
          TELEGRAM_UPDATE_SECRET: ${{ secrets.TELEGRAM_UPDATE_SECRET }}
        run: python send_to_api.py
          
      - name: Cleanup temporary files
        if: always()
        run: |
          rm -f send_to_api.py
          rm -f telegram_posts.json
          rm -rf temp_telegram/